# Target companies polled directly via their ATS public API (once per run each).
# ats: greenhouse | lever | ashby  -> token: the board slug, e.g. boards.greenhouse.io/<token>
# ats: workday                     -> url: https://<co>.wdN.myworkdayjobs.com/<Site>
# ats: oracle                      -> url: https://<host>.oraclecloud.com/hcmUI/CandidateExperience/en/sites/<Site>
# ats: smartrecruiters             -> token: the company id from jobs.smartrecruiters.com/<token>/...
# ats: successfactors              -> url: the career site's root, e.g. https://careers.dteenergy.com
#                                     (SAP SuccessFactors sites with /search/ and /job/<slug>/<id>/ pages)
# Workday / Oracle / SmartRecruiters / SuccessFactors accept an optional `search:` list of terms
# (default ["software engineer", "software developer"]).
#
# Add more with:  python -m jobsearch find-boards              (probes every company in your tracker)
#                 python -m jobsearch find-boards "Company A" "Company B"
# Verify with:    python -m jobsearch check-sources
#
# Companies not listed here still show up via the SimplifyJobs New-Grad-Positions feed.

