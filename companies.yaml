# Target companies polled directly via their ATS public API (once per run each).
# ats: greenhouse | lever | ashby | workday (workday has no public API; keep enabled: false)
# token: the board slug from the careers URL, e.g. boards.greenhouse.io/<token>
#
# Add more with:  python -m jobsearch find-boards              (probes every company in your tracker)
#                 python -m jobsearch find-boards "Company A" "Company B"
# Verify with:    python -m jobsearch check-sources
#
# Companies not listed here still show up via the SimplifyJobs New-Grad-Positions feed.

companies:
  # Michigan / Midwest
  - {name: May Mobility, ats: greenhouse, token: maymobility, enabled: true}
  - {name: Censys, ats: greenhouse, token: censys, enabled: true}
  - {name: StockX, ats: greenhouse, token: stockx, enabled: true}
  - {name: Rovisys, ats: workday, token: "", enabled: false}
  - {name: Rocket Companies, ats: workday, token: "", enabled: false}
  - {name: Ford, ats: workday, token: "", enabled: false}
  - {name: General Motors, ats: workday, token: "", enabled: false}

