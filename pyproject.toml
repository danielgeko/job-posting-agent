[project]
name = "jobsearch"
version = "0.1.0"
description = "Daily new-grad SWE job discovery: fetch, filter, score, and write leads to Google Sheets."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "gspread>=6.0",
    "google-auth>=2.29",
    "anthropic>=1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
jobsearch = "jobsearch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jobsearch", "jobsearch.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
